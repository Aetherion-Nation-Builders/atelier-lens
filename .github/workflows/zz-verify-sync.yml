# Throwaway: lives only on a verify/* branch to run the repo's own gate on a sync before its PR is
# merged. Never merged.
name: Verify sync

on:
  push:
    branches: ["verify/**"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libudev-dev libfontconfig1-dev libssl-dev pkg-config cmake nasm clang ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Gate
        shell: bash
        run: |
          set -o pipefail
          if grep -qE '"ci"' xtask/src/*.rs 2>/dev/null; then
            cargo xtask ci 2>&1 | tee gate.log
          else
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee gate.log
            cargo test --workspace --locked 2>&1 | tee -a gate.log
          fi
      - name: Failing tests
        if: failure()
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*m//g' gate.log > clean.log || true
          { grep -E "^test .* FAILED|^error(\[|:)|panicked at|^failures:|^    [a-z_:0-9]+$|^\s+--> |assertion|left:|right:|✗|violation" clean.log | head -120; echo "----- tail -----"; tail -n 60 clean.log; } > report.txt
          python3 - <<'PY'
          t = open("report.txt", encoding="utf-8", errors="replace").read()
          for i in range(0, min(len(t), 9 * 3000), 3000):
              c = t[i:i + 3000]
              print("::error title=gate report::" + c.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
